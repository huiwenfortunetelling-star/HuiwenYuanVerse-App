<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>符验证中心 · 慧文国际善缘界</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#050609;
      --panel:#0c0e15;
      --panel2:#090a0f;
      --gold:#e0b14e;
      --gold2:#f0cb72;
      --text:#edf0f6;
      --muted:#99a3b4;
      --line:rgba(224,177,78,.22);
      --expired:#b8bec8;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:radial-gradient(circle at 50% 0%,#131622 0,#080910 38%,var(--bg) 72%);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    body{min-height:100vh}
    .page{
      width:min(1040px,calc(100% - 28px));
      margin:0 auto;
      padding:34px 0 70px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:13px;
      margin-bottom:23px;
    }
    .brand-mark{
      width:44px;
      height:44px;
      flex:none;
      border-radius:50%;
      background:linear-gradient(145deg,#f7d77f,#bb8122 58%,#704713);
      box-shadow:0 4px 18px rgba(224,177,78,.2),inset 0 0 0 1px rgba(255,255,255,.2);
    }
    .brand-title{
      margin:0;
      font-size:1.18rem;
      white-space:nowrap;
    }
    .brand-sub{
      margin:4px 0 0;
      color:var(--muted);
      font-size:.78rem;
    }
    .card{
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(145deg,var(--panel),var(--panel2));
      box-shadow:0 24px 70px rgba(0,0,0,.32);
    }
    .content{
      display:grid;
      grid-template-columns:minmax(300px,480px) minmax(0,1fr);
      gap:38px;
      align-items:center;
      padding:34px;
    }
    .image-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:430px;
      overflow:hidden;
      border:1px solid rgba(224,177,78,.14);
      border-radius:19px;
      background:#050609;
    }
    .talisman{
      display:block;
      width:100%;
      height:auto;
      max-height:720px;
      object-fit:contain;
    }
    .image-pending{
      padding:40px 20px;
      color:var(--muted);
      text-align:center;
      line-height:1.8;
    }
    .details{min-width:0}
    .row{
      display:grid;
      grid-template-columns:110px minmax(0,1fr);
      gap:18px;
      padding:21px 0;
      border-bottom:1px solid rgba(255,255,255,.075);
    }
    .row:first-child{padding-top:0}
    .row:last-child{border-bottom:0;padding-bottom:0}
    .label{
      color:var(--muted);
      font-size:.93rem;
    }
    .value{
      color:var(--text);
      font-size:1.04rem;
      font-weight:600;
      overflow-wrap:anywhere;
    }
    .product-name{
      color:var(--gold2);
      font-size:1.13rem;
      font-weight:700;
    }
    .status{
      display:inline-flex;
      align-items:center;
      gap:8px;
      width:max-content;
      max-width:100%;
      padding:7px 12px;
      border:1px solid rgba(224,177,78,.48);
      border-radius:999px;
      color:var(--gold2);
      background:rgba(224,177,78,.08);
      font-size:.9rem;
      font-weight:700;
    }
    .status::before{
      content:"";
      width:8px;
      height:8px;
      flex:none;
      border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 10px rgba(224,177,78,.75);
    }
    .status.expired{
      color:var(--expired);
      border-color:rgba(184,190,200,.3);
      background:rgba(184,190,200,.06);
    }
    .status.expired::before{
      background:#8f96a3;
      box-shadow:none;
    }
    .message{
      padding:70px 24px;
      text-align:center;
      color:var(--muted);
    }
    .message strong{
      display:block;
      margin-bottom:10px;
      color:var(--text);
      font-size:1.12rem;
    }
    [hidden]{display:none!important}

    @media(max-width:760px){
      .page{
        width:min(100% - 18px,1040px);
        padding-top:18px;
      }
      .brand{
        margin:0 8px 18px;
      }
      .brand-mark{
        width:38px;
        height:38px;
      }
      .brand-title{
        font-size:1rem;
      }
      .card{
        border-radius:18px;
      }
      .content{
        grid-template-columns:1fr;
        gap:22px;
        padding:18px;
      }
      .image-wrap{
        min-height:0;
      }
      .talisman{
        max-height:none;
      }
      .row{
        grid-template-columns:92px minmax(0,1fr);
        gap:12px;
        padding:17px 0;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1 class="brand-title">慧文国际善缘界</h1>
        <p class="brand-sub">专属符验证中心</p>
      </div>
    </header>

    <section id="loading" class="card">
      <div class="message">
        <strong>正在验证</strong>
        正在读取验证资料，请稍候…
      </div>
    </section>

    <section id="error" class="card" hidden>
      <div class="message">
        <strong id="error-title">无法验证</strong>
        <span id="error-text">未找到对应的验证资料。</span>
      </div>
    </section>

    <section id="record" class="card" hidden>
      <div class="content">
        <!-- 1. 符图片 -->
        <div class="image-wrap">
          <img id="talisman-image" class="talisman" alt="专属符" hidden />
          <div id="image-pending" class="image-pending" hidden>符图片尚未上传</div>
        </div>

        <div class="details">
          <!-- 2. 符名称 -->
          <div class="row">
            <div class="label">符名称</div>
            <div id="product-name" class="value product-name">—</div>
          </div>

          <!-- 3. 购买日期 -->
          <div class="row">
            <div class="label">购买时间</div>
            <div id="purchase-time" class="value">—</div>
          </div>

          <!-- 4. 到期日期 -->
          <div class="row">
            <div class="label">到期时间</div>
            <div id="expiry-time" class="value">—</div>
          </div>

          <!-- 5. 状态 -->
          <div class="row">
            <div class="label">状态</div>
            <div>
              <span id="talisman-status" class="status">有效</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/api/supabase/config"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async function () {
      const loading = document.getElementById('loading');
      const errorBox = document.getElementById('error');
      const recordBox = document.getElementById('record');

      function showError(title, text) {
        loading.hidden = true;
        recordBox.hidden = true;
        document.getElementById('error-title').textContent = title;
        document.getElementById('error-text').textContent = text;
        errorBox.hidden = false;
      }

      const token = new URLSearchParams(window.location.search).get('code')?.trim();

      if (!token) {
        showError('验证码缺失', '此链接没有包含有效的验证编号。');
        return;
      }

      if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY) {
        showError('验证服务暂不可用', '无法连接验证数据库，请稍后重试。');
        return;
      }

      const client = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false
          }
        }
      );

      try {
        const { data, error } = await client.rpc('get_verification_record', {
          p_token: token
        });

        if (error) throw error;

        const item = Array.isArray(data) ? data[0] : data;

        if (!item) {
          showError('验证资料不存在', '未找到与此二维码对应的有效购买记录。');
          return;
        }

        const image = document.getElementById('talisman-image');
        const pending = document.getElementById('image-pending');

        if (item.talisman_image_url) {
          image.src = item.talisman_image_url;
          image.hidden = false;
          pending.hidden = true;
        } else {
          image.hidden = true;
          pending.hidden = false;
        }

        document.getElementById('product-name').textContent =
          item.product_name || '—';

        document.getElementById('purchase-time').textContent =
          item.purchase_time || '—';

        document.getElementById('expiry-time').textContent =
          item.expiry_time || '—';

        const statusEl = document.getElementById('talisman-status');
        const expired = String(item.status || '').toLowerCase() === 'expired';

        statusEl.textContent = expired ? '已失效' : '有效';
        statusEl.classList.toggle('expired', expired);

        loading.hidden = true;
        errorBox.hidden = true;
        recordBox.hidden = false;
      } catch (err) {
        console.error('Verification error:', err);
        showError('验证失败', '读取验证资料时发生错误，请稍后重试。');
      }
    })();
  </script>
</body>
</html>
